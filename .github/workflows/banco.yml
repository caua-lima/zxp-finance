name: Sincronizar banco

# Puxa saldo, extrato e cofrinhos do banco (Open Finance via Meu Pluggy) de
# 3 em 3 horas. O Meu Pluggy atualiza o banco a cada 24 h; rodar mais vezes
# só pega a atualização mais cedo. Mesmos segredos do executor de entregas.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: banco
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a sincronização
        env:
          ZXP_URL: ${{ secrets.ZXP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ZXP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Segredos ZXP_URL/CRON_SECRET ainda não cadastrados — nada a fazer."
            exit 0
          fi
          codigo=$(curl -s -o resposta.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$ZXP_URL/api/cron/banco")
          # só contadores, sem dado pessoal
          cat resposta.json; echo
          if [ "$codigo" != "200" ]; then
            echo "::error::Sincronização respondeu $codigo"
            exit 1
          fi
