name: CI

on:
  push:
    # main e as branches de trabalho (a mentoria é feita em feat/*): CI do SHA
    # exato de cada push, não só do PR
    branches: [main, "feat/**", "fix/**", "auditoria-**"]
  pull_request:
    branches: [main]

# push novo na mesma branch cancela o run anterior, que já está superado
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Valores fake — build não conecta no Firebase de verdade, só
        # precisa que as env vars existam pro next build não quebrar.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-placeholder
        run: npm run build

  # Regras do Firestore e servidor de notificações contra o emulador
  # (isolamento A/B, mês fechado, idempotência, retry, 410, VAPID inválida).
  regras-e-notificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Regras + notificações (emulador)
        run: npm run test:regras

      - name: Backup e restauração (emulador)
        run: npm run test:restauracao
